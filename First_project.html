<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My DevOps Project</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 500px;
            padding: 35px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #4b3ca7;
            margin-bottom: 25px;
        }

        h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .team {
            background: #f3f0ff;
            padding: 15px;
            border-radius: 12px;
        }

        .member {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            margin: 8px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        .leader {
            border: 3px solid #ffd700;
        }

        .leader::after {
            content: " ⭐ Team Leader";
            color: #fff;
        }

        .deliverable {
            margin-top: 25px;
            background: #4b3ca7;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚀 My DevOps Project</h1>

        <h2>Team Members</h2>

        <div class="team">
            <div class="member leader">Areeba Abid</div>
            <div class="member">Zainab Suleman</div>
            <div class="member">Malaika Munir</div>
            <div class="member">Areeba Khan</div>
        </div>

        <div class="deliverable">
            Deliverable No 1
        </div>

    </div>

</body>
</html>
